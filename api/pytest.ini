[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*exceeds room boundaries.*:UserWarning
    ignore:.*wavelength value 254.*:UserWarning
    ignore:.*guv_type value Low-pressure mercury.*:UserWarning
    ignore:.*No lamps are present in the room.*:UserWarning
    ignore:.*File was saved with guv-calcs.*:UserWarning

