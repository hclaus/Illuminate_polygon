document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ow-y: auto; padding: 14px; }\n.sidebar-scroll::-webkit-scrollbar { width: 10px; }\n.sidebar-scroll::-webkit-scrollbar-thumb { background: #d4d9e1; border-radius: 8px; border: 3px solid var(--panel); }\n\n.card {\n  background: var(--panel); border: 1px solid var(--line);\n  border-radius: var(--radius); padding: 14px; margin-bottom: 12px;\n}\n.card-title {\n  font-size: 11px; font-weight: 600; text-transform: uppercase;\n  letter-spacing: .09em; color: var(--muted); margin: 0 0 12px;\n}\n\n.field { margin-bottom: 12px; }\n.field:last-child { margin-bottom: 0; }\n.field > label {\n  display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-2);\n  margin-bottom: 6px;\n}\n.hint { font-weight: 400; color: var(--muted); font-size: 11px; }\n\n.text, .select {\n  width: 100%; padding: 8px 10px; font-size: 13px;\n  border: 1px solid var(--line-2); border-radius: 8px; background: #fff;\n  color: var(--ink); font-family: inherit;\n}\n.text:focus, .select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }\n.text.mono, .mono { font-family: \"IBM Plex Mono\", monospace; }\n.small { font-size: 12px; }\n.muted { color: var(--muted); }\n\n.row { display: flex; align-items: stretch; }\n.row.gap { gap: 8px; }\n.row.center { align-items: center; }\n.grow { flex: 1; }\n\n.btn {\n  border: 1px solid var(--line-2); background: #fff; color: var(--ink);\n  font-family: inherit; font-size: 13px; font-weight: 500; padding: 8px 12px;\n  border-radius: 8px; cursor: pointer; transition: background .12s, border-color .12s, box-shadow .12s;\n  white-space: nowrap;\n}\n.btn:hover { background: var(--panel-2); border-color: #c2c8d2; }\n.btn:active { transform: translateY(.5px); }\n.btn-ghost.icon { padding: 8px 10px; }\n.btn-primary {\n  background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;\n}\n.btn-primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }\n.btn.small { padding: 5px 10px; font-size: 12px; }\n\n.linkbtn {\n  background: none; border: none; color: var(--accent); font-size: 12.5px;\n  cursor: pointer; padding: 6px 0 0; font-family: inherit; font-weight: 500;\n}\n.linkbtn:hover { text-decoration: underline; }\n\n.filemeta { font-size: 12px; color: var(--muted); margin-top: 7px; word-break: break-all; }\n\n/* swatches */\n.swatch-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }\n.swatch {\n  width: 26px; height: 22px; border-radius: 6px; cursor: pointer;\n  border: 1px solid rgba(0,0,0,.16); padding: 0; position: relative;\n}\n.swatch.big { width: 34px; height: 26px; }\n.swatch::after { content: \"\"; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); }\n\n/* range */\ninput[type=range] { width: 100%; accent-color: var(--accent); }\n\n/* switches */\n.switch { display: flex; align-items: center; gap: 10px; padding: 7px 0; cursor: pointer; }\n.switch input { position: absolute; opacity: 0; }\n.switch .track {\n  width: 38px; height: 22px; border-radius: 12px; background: #cdd2db; position: relative;\n  transition: background .15s; flex: none;\n}\n.switch .track::after {\n  content: \"\"; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;\n  background: #fff; border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25);\n}\n.switch input:checked + .track { background: var(--accent); }\n.switch input:checked + .track::after { transform: translateX(16px); }\n.switch-label { font-size: 13px; color: var(--ink-2); }\n\n/* overlay list */\n.overlay-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }\n.ov-item {\n  display: flex; align-items: center; gap: 10px; padding: 8px;\n  border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2);\n}\n.ov-item.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); background: #fff; }\n.ov-thumb { width: 40px; height: 40px; flex: none; border-radius: 6px; background: #fff center/contain no-repeat; border: 1px solid var(--line-2); }\n.ov-item .ov-meta { flex: 1; min-width: 0; }\n.ov-item .ov-meta .ov-row { display: flex; align-items: center; gap: 6px; }\n.ov-item .ov-meta input[type=range] { flex: 1; }\n.ov-mini { font-size: 11px; color: var(--muted); }\n.ov-btn { border: none; background: none; cursor: pointer; color: var(--muted); padding: 4px; border-radius: 6px; font-size: 12px; }\n.ov-btn:hover { background: #e7eaf0; color: var(--ink); }\n.ov-btn.del:hover { color: var(--danger); }\n.tip { font-size: 11.5px; color: var(--muted); margin: 12px 0 0; line-height: 1.5; }\n\n.sidebar-foot { padding: 12px 14px; border-top: 1px solid var(--line); background: var(--panel); }\n.foot-label { font-size: 12px; color: var(--muted); }\n.select.small { width: auto; padding: 7px 8px; font-size: 12px; }\n\n/* ---------------- Stage ---------------- */\n.stage { display: flex; flex-direction: column; min-width: 0; background: var(--bg); }\n.stage-toolbar {\n  display: flex; align-items: center; gap: 10px; padding: 10px 16px;\n  border-bottom: 1px solid var(--line); background: rgba(255,255,255,.55); backdrop-filter: blur(4px);\n}\n.stage-toolbar .spacer { flex: 1; }\n.status { font-size: 12.5px; color: var(--muted); }\n.zoom-label { font-size: 12px; color: var(--muted); min-width: 42px; text-align: right; }\n\n.stage-area { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 28px; }\n.figure-scaler { position: relative; flex: none; }\n.figure-wrap { position: relative; transform-origin: top left; }\n.figure-wrap canvas {\n  display: block; background: #fff; border-radius: 6px;\n  box-shadow: 0 4px 24px rgba(20,24,40,.12), 0 0 0 1px rgba(20,24,40,.05);\n}\n.overlay-layer { position: absolute; inset: 0; }\n\n/* contour label layer — labels capture pointer events, layer itself does not */\n.label-layer { position: absolute; inset: 0; pointer-events: none; }\n.c-label {\n  position: absolute; pointer-events: auto; cursor: grab; white-space: nowrap;\n  font: 600 13px \"IBM Plex Mono\", monospace; color: #15171c;\n  transform-origin: center center; user-select: none; padding: 3px 4px;\n  text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff,\n               0 0 3px #fff, 0 0 3px #fff;\n}\n.c-label:hover { color: var(--accent-ink); }\n.c-label:active { cursor: grabbing; }\n.c-label.dragging { color: var(--accent-ink); }\n\n/* overlay boxes */\n.ov-box { position: absolute; touch-action: none; cursor: grab; }\n.ov-box img { width: 100%; height: 100%; display: block; pointer-events: none; user-select: none; }\n.ov-box:active { cursor: grabbing; }\n.ov-frame { position: absolute; inset: 0; border: 1.5px solid var(--accent); box-shadow: 0 0 0 1px rgba(255,255,255,.8); pointer-events: none; }\n.ov-handle {\n  position: absolute; width: 13px; height: 13px; background: #fff; border: 1.5px solid var(--accent);\n  border-radius: 3px; transform: translate(-50%, -50%); cursor: nwse-resize; touch-action: none;\n}\n.ov-ne, .ov-sw { cursor: nesw-resize; }\n.ov-rotstem { position: absolute; left: 50%; top: 0; width: 1.5px; height: 26px; background: var(--accent); transform: translate(-50%, -100%); pointer-events: none; }\n.ov-rothandle {\n  position: absolute; left: 50%; top: -26px; width: 15px; height: 15px; border-radius: 50%;\n  background: #fff; border: 1.5px solid var(--accent); transform: translate(-50%, -50%); cursor: grab; touch-action: none;\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"app\">\n  <!-- ===================== SIDEBAR ===================== -->\n  <aside class=\"sidebar\">\n    <header class=\"brand\">\n      <div class=\"brand-mark\"><\u002Fdiv>\n      <div>\n        <h1>Contour Plotter<\u002Fh1>\n        <p>2D field visualisation<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <div class=\"sidebar-scroll\">\n      <!-- DATA -->\n      <section class=\"card\">\n        <h2 class=\"card-title\">Data<\u002Fh2>\n        <div class=\"field\">\n          <label>CSV file<\u002Flabel>\n          <div class=\"row\">\n            <button id=\"loadCsvBtn\" class=\"btn btn-ghost grow\">Browse…<\u002Fbutton>\n            <input type=\"file\" id=\"csvInput\" accept=\".csv,text/csv\" hidden=\"\">\n          <\u002Fdiv>\n          <div class=\"filemeta\"><span id=\"csvName\">No file loaded<\u002Fspan><\u002Fdiv>\n          <button id=\"sampleBtn\" class=\"linkbtn\">Load sample dataset<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label for=\"titleInput\">Plot title<\u002Flabel>\n          <input type=\"text\" id=\"titleInput\" class=\"text\" placeholder=\"Plot title\" autocomplete=\"off\">\n        <\u002Fdiv>\n        <div class=\"row gap\">\n          <div class=\"field grow\">\n            <label for=\"xLabelInput\">X axis label<\u002Flabel>\n            <input type=\"text\" id=\"xLabelInput\" class=\"text\" autocomplete=\"off\">\n          <\u002Fdiv>\n          <div class=\"field grow\">\n            <label for=\"yLabelInput\">Y axis label<\u002Flabel>\n            <input type=\"text\" id=\"yLabelInput\" class=\"text\" autocomplete=\"off\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- THRESHOLDS -->\n      <section class=\"card\">\n        <h2 class=\"card-title\">Thresholds<\u002Fh2>\n        <div class=\"field\">\n          <label for=\"presetSelect\">Preset<\u002Flabel>\n          <div class=\"row gap\">\n            <select id=\"presetSelect\" class=\"select grow\" autocomplete=\"off\"><\u002Fselect>\n            <button id=\"savePresetBtn\" class=\"btn btn-ghost icon\" title=\"Save current as preset\">Save<\u002Fbutton>\n            <button id=\"delPresetBtn\" class=\"btn btn-ghost icon\" title=\"Delete preset\">Del<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"row gap\" style=\"margin-top:8px;align-items:center\">\n            <button id=\"exportPresetsBtn\" class=\"linkbtn\">Export presets…<\u002Fbutton>\n            <span class=\"hint\">·<\u002Fspan>\n            <button id=\"importPresetsBtn\" class=\"linkbtn\">Import…<\u002Fbutton>\n            <input type=\"file\" id=\"presetsFile\" accept=\"application/json,.json\" hidden=\"\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label for=\"levelsInput\">Levels <span class=\"hint\">comma-separated<\u002Fspan><\u002Flabel>\n          <input type=\"text\" id=\"levelsInput\" class=\"text mono\" autocomplete=\"off\">\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label for=\"labelsInput\">Labels<\u002Flabel>\n          <input type=\"text\" id=\"labelsInput\" class=\"text\" autocomplete=\"off\">\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label for=\"colorsInput\">Band colors<\u002Flabel>\n          <input type=\"text\" id=\"colorsInput\" class=\"text mono\" autocomplete=\"off\">\n          <div id=\"swatchRow\" class=\"swatch-row\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label>Floor color <span class=\"hint\">below lowest level<\u002Fspan><\u002Flabel>\n          <div class=\"row gap center\">\n            <button id=\"floorSwatch\" class=\"swatch big\" type=\"button\"><\u002Fbutton>\n            <span id=\"floorHex\" class=\"mono muted small\"><\u002Fspan>\n            <input type=\"color\" id=\"floorColor\" hidden=\"\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- SMOOTHING -->\n      <section class=\"card\">\n        <h2 class=\"card-title\">Smoothing<\u002Fh2>\n        <div class=\"field\">\n          <label for=\"sigma\">Contour smoothing <span id=\"sigmaVal\" class=\"hint mono\"><\u002Fspan><\u002Flabel>\n          <input type=\"range\" id=\"sigma\" min=\"0\" max=\"3\" step=\"0.05\">\n          <p class=\"tip\">Rounds the contour curves without altering the underlying values.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- DISPLAY -->\n      <section class=\"card\">\n        <h2 class=\"card-title\">Display<\u002Fh2>\n        <label class=\"switch\"><input type=\"checkbox\" id=\"filled\" checked=\"\"><span class=\"track\"><\u002Fspan><span class=\"switch-label\">Filled bands<\u002Fspan><\u002Flabel>\n        <label class=\"switch\"><input type=\"checkbox\" id=\"contourLabels\" checked=\"\"><span class=\"track\"><\u002Fspan><span class=\"switch-label\">Contour labels<\u002Fspan><\u002Flabel>\n        <label class=\"switch\"><input type=\"checkbox\" id=\"grid\" checked=\"\"><span class=\"track\"><\u002Fspan><span class=\"switch-label\">Grid lines<\u002Fspan><\u002Flabel>\n        <label class=\"switch\"><input type=\"checkbox\" id=\"equalAspect\" checked=\"\"><span class=\"track\"><\u002Fspan><span class=\"switch-label\">Equal aspect ratio<\u002Fspan><\u002Flabel>\n        <label class=\"switch\"><input type=\"checkbox\" id=\"flipY\" checked=\"\"><span class=\"track\"><\u002Fspan><span class=\"switch-label\">Flip Y-axis<\u002Fspan><\u002Flabel>\n      <\u002Fsection>\n\n      <!-- OVERLAYS -->\n      <section class=\"card\">\n        <h2 class=\"card-title\">Overlays<\u002Fh2>\n        <div class=\"row gap\">\n          <button id=\"addOverlayBtn\" class=\"btn btn-ghost grow\">Add image…<\u002Fbutton>\n          <button id=\"addHeadBtn\" class=\"btn btn-ghost grow\">Add head sample<\u002Fbutton>\n          <input type=\"file\" id=\"overlayInput\" accept=\"image/*\" hidden=\"\">\n        <\u002Fdiv>\n        <div id=\"overlayList\" class=\"overlay-list\"><\u002Fdiv>\n        <p class=\"tip\">Drag to move · corner handles resize · top handle rotates (hold ⇧ to snap)<\u002Fp>\n      <\u002Fsection>\n    <\u002Fdiv>\n\n    <footer class=\"sidebar-foot\">\n      <div class=\"row gap center\">\n        <label class=\"foot-label\" for=\"exportScale\">Export<\u002Flabel>\n        <select id=\"exportScale\" class=\"select small\" autocomplete=\"off\">\n          <option value=\"1\">1×<\u002Foption>\n          <option value=\"2\" selected=\"\">2×<\u002Foption>\n          <option value=\"3\">3×<\u002Foption>\n        <\u002Fselect>\n        <button id=\"savePngBtn\" class=\"btn btn-primary grow\">Save PNG<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Ffooter>\n  <\u002Faside>\n\n  <!-- ===================== STAGE ===================== -->\n  <main class=\"stage\">\n    <div class=\"stage-toolbar\">\n      <span id=\"statusMsg\" class=\"status\"><\u002Fspan>\n      <div class=\"spacer\"><\u002Fdiv>\n      <button id=\"fitBtn\" class=\"btn btn-ghost small\">Fit<\u002Fbutton>\n      <span id=\"zoomLabel\" class=\"zoom-label mono\">100%<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"stage-area\" id=\"stageArea\">\n      <div class=\"figure-scaler\" id=\"figureScaler\">\n        <div class=\"figure-wrap\" id=\"figureWrap\">\n          <canvas id=\"figure\"><\u002Fcanvas>\n          <div class=\"overlay-layer\" id=\"overlayLayer\"><\u002Fdiv>\n          <div class=\"label-layer\" id=\"labelLayer\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<script src=\"a72d51dc-bdf4-4e39-a229-7b60f06a2a98\"><\u002Fscript>\n<script src=\"743d9caf-01fb-4a5b-b405-ab8a5dfb094a\"><\u002Fscript>\n<script src=\"8cdef4a2-533a-4afb-b322-0b6f6fcb0b3a\"><\u002Fscript>\n<script src=\"ef77b3d4-5fe4-4393-9170-a0fda33f56f1\"><\u002Fscript>\n<script src=\"34680a56-3f49-4f72-a09d-6c1598745eec\"><\u002Fscript>\n<script src=\"3242d2a1-b688-4df8-bc51-400011760368\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
